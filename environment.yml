# CAMulator environment — CREDIT (PyTorch) for training and climate inference.
#
# Versions (tested on NCAR Casper, June 2026 — not yet verified on other hosts):
#   Python  3.11
#   PyTorch 2.6.0  + CUDA 12.4 (pip wheel from pytorch.org index)
#   NumPy   2.2.x
#   Xarray  2025.6.x
#
# Targets linux-x86_64 + NVIDIA CUDA 12.x. On a different host CUDA, change the
# torch index-url / version below to match (or use CPU wheels — inference works
# on CPU, just slower). Known-good alternative for the CAMulator path: the NCAR
# env at /glade/work/wchapman/conda-envs/credit-coupling-ud (PyTorch 2.x).
#
# Build:
#   conda env create -f environment.yml -n camulator
#   conda activate camulator
#   pip install -e .            # CREDIT (this repo) editable install
#
# Then, for inference (see climate/README.md):
#   cd climate && python download_assets.py --repo_id <user>/camulator
#   bash RunQuickClimate.sh

name: camulator

channels:
  - conda-forge
  - nodefaults

dependencies:
  # ── Python ─────────────────────────────────────────────────────────
  - python=3.11
  - pip>=24

  # ── Core scientific stack ──────────────────────────────────────────
  - numpy=2.2.*
  - scipy>=1.15
  - pandas>=2.3
  - xarray>=2025.6
  - dask>=2025.0
  - zarr=2.18.*                  # pin: CREDIT datasets use zarr v2 stores
  - matplotlib-base>=3.9
  - tqdm
  - pyyaml
  - click
  - ipython
  - ipykernel

  # ── NetCDF I/O ─────────────────────────────────────────────────────
  - netcdf4>=1.7
  - cftime>=1.6                  # no-leap rollout clock + output time stamps
  - hdf5=1.14.*                  # pin: matches netCDF4 + zarr v2 build

  # ── GeoSpatial (optional: plotting / validation) ───────────────────
  - cartopy>=0.24
  - pyproj
  - shapely

  # ── Build tooling (only if a pip dep builds a wheel) ───────────────
  - cython
  - setuptools-scm

  # ── Pip: PyTorch (from pytorch.org index) + CREDIT deps ────────────
  - pip:
      # PyTorch 2.6 + CUDA 12.4 wheels.
      # If solving fails, install torch separately with:
      #   pip install torch==2.6.0 torchvision==0.21.0 \
      #     --index-url https://download.pytorch.org/whl/cu124
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - torchvision==0.21.0
      - torchinfo==1.8.0
      - torchmetrics==1.9.0
      - torch-geometric==2.7.0
      - torch-harmonics==0.9.1

      # CREDIT auxiliaries
      - einops>=0.8            # tensor ops in the model
      - bridgescaler>=0.8      # CREDIT normalization
      - accelerate>=1.6
      - ema-pytorch>=0.7
      - bitsandbytes>=0.45     # 8-bit Adam (training; harmless at inference)
      - tensorboard

      # Asset download from HuggingFace (climate/download_assets.py)
      - huggingface_hub>=0.24

      # CDS API for users pulling ERA5 directly (optional)
      - cdsapi>=0.7
      - ecmwf-api-client
